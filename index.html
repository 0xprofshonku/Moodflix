<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodFlix - Movie Recommendations Based on Your Mood</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="py-6 border-b border-slate-800 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-400 tracking-wide">🎬 MoodFlix</h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">Feeling happy, sad, or adventurous? Let us pick your next watch!</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        
        <!-- Mood Selection Buttons -->
        <section class="text-center mb-12">
            <h2 class="text-xl font-semibold mb-6">How is your mood right now?</h2>
            <div class="flex flex-wrap justify-center gap-4">
                <button onclick="getRecommendations('happy')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-6 rounded-full transition-all transform hover:scale-105 shadow-lg cursor-pointer">😊 Happy</button>
                <button onclick="getRecommendations('sad')" class="bg-sky-600 hover:bg-sky-500 text-white font-medium py-3 px-6 rounded-full transition-all transform hover:scale-105 shadow-lg cursor-pointer">😢 Sad / Emotional</button>
                <button onclick="getRecommendations('romantic')" class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-3 px-6 rounded-full transition-all transform hover:scale-105 shadow-lg cursor-pointer">❤️ Romantic</button>
                <button onclick="getRecommendations('thrilled')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 px-6 rounded-full transition-all transform hover:scale-105 shadow-lg cursor-pointer">😱 Thrilled / Excited</button>
            </div>
        </section>

        <!-- Movie Results Grid -->
        <section>
            <h3 id="result-heading" class="text-2xl font-bold mb-6 text-center text-indigo-300 hidden">Recommended for you:</h3>
            <div id="movie-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Movie cards will dynamically populate here via JavaScript -->
            </div>
        </section>
        
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        Created for learning JavaScript & Tailwind CSS. View on <a href="#" class="underline hover:text-slate-300">GitHub</a>.
    </footer>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
